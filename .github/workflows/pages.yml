name: pages

# document/ を GitHub Pages (https://ukatech.github.io/kawari/) に公開する。
# 初回だけ、リポジトリの Settings > Pages > Source を "GitHub Actions" にしておく。
# master への push で document/ に変更があったときと、手動実行 (Run workflow) で動く。
on:
  push:
    branches: [master]
    paths:
      - 'document/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開の途中で次の実行が割り込まないようにする (実行中のものは止めない)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: document
      - id: deployment
        uses: actions/deploy-pages@v4
